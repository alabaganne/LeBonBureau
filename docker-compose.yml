# Production sur un VPS : voir DEPLOY.md. Les valeurs viennent du fichier .env à côté.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: medusa
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Joignable seulement depuis le VPS lui-même (tunnel SSH de DBeaver, voir DATABASE.md).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  medusa:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Postgres tourne sur le même VPS, sans SSL.
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      MEDUSA_BACKEND_URL: https://${API_DOMAIN:?}
      STORE_CORS: https://${DOMAIN:?}
      ADMIN_CORS: https://${API_DOMAIN}
      AUTH_CORS: https://${API_DOMAIN},https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?}
      COOKIE_SECRET: ${COOKIE_SECRET:?}
      STOREFRONT_URL: https://${DOMAIN}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
    volumes:
      - medusa_static:/app/static

  storefront:
    build:
      context: .
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_META_PIXEL_ID: ${META_PIXEL_ID:-}
        NEXT_PUBLIC_GA_ID: ${GA_ID:-}
    restart: unless-stopped
    depends_on:
      - medusa
    environment:
      MEDUSA_BACKEND_URL: http://medusa:9000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - storefront
      - medusa

volumes:
  pg_data:
  redis_data:
  medusa_static:
  caddy_data:
  caddy_config:
